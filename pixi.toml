[workspace]
authors = ["Frank Loesche <loeschef@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "specsail"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
run = "python -u spectrometer.py"
log = "python -u spectrometer_logger.py"
plot = "python -u plot_spectra.py"
calibrate = "python -u calibrate_sunlight.py"
save = "python -u save_results.py"
clear = "rm -f data/*.csv"
migrate = "python -u migrate_data.py"
calrun = "python -u calibration_run.py"
test = "python -m unittest discover -s tests -t ."
monitor = "python -u -m run_monitor"
watch = "python -u -m run_monitor.watch"

[dependencies]
seabreeze = ">=2.11.0,<3"
matplotlib = "*"
numpy = "*"
